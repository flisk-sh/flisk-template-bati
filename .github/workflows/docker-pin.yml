name: docker-pin
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docker-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Dockerfile scaffolder pin
        run: |
          node scripts/check-docker-pin.mjs
          node --test scripts/check-docker-pin.test.mjs
